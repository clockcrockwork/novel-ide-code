version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # 新規公開パッケージの悪意・不安定リスク対策（semgrep: dependabot-missing-cooldown）
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - dependencies
    # パッケージ単位に分割された PR は、peer を完全一致でピンする依存群（@tiptap/* 等）を
    # 単独ではロック解決できない形で届ける。production / development の 2 群にまとめる（#565）
    groups:
      production:
        dependency-type: production
      development:
        dependency-type: development
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: npm
    directory: /worker
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      production:
        dependency-type: production
      development:
        dependency-type: development
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    labels:
      - dependencies
    # github-actions に production / development の区別はないため全体で 1 群にする
    groups:
      actions:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
